[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assistops"
version = "0.1.0"
description = "Assistant IA pour les opérations — socle du MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "structlog==25.5.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
