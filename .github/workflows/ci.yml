name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium for approval UI E2E tests
        run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test integrations/n8n/assistops.test.js
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate synthetic corpus and reference evidence
        run: python -m assistops.corpus
      - run: pytest
      - run: docker compose -f compose.yaml -f compose.n8n.yaml config --quiet
      - name: Validate opt-in Slack configuration without real credentials
        env:
          SLACK_BOT_TOKEN: test-only
          SLACK_APP_TOKEN: test-only
          SLACK_CONNECTOR_SECRET: test-only-slack-secret-32-characters
          SLACK_TEAM_ID: TTEST
          SLACK_CHANNEL_ID: CTEST
          SLACK_USER_MAP: '{"UTEST":"user-001"}'
        run: docker compose -f compose.yaml -f compose.n8n.yaml -f compose.slack.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.n8n.yaml up --build --wait --wait-timeout 240
      - name: Verify readiness
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health/ready
      - name: PostgreSQL and Qdrant integration tests
        env:
          ASSISTOPS_TEST_DATABASE_URL: postgresql://assistops:assistops-local-only@localhost:5432/assistops
          ASSISTOPS_TEST_QDRANT_URL: http://localhost:6333
        run: pytest -m integration
      - name: Signed webhook, replay and demo worker over HTTP
        run: python scripts/send_demo_event.py --wait
      - name: Synthetic business tools and human approval over HTTP
        run: python scripts/check_business_flow.py
      - name: n8n authenticated webhooks and synthetic operations
        run: python scripts/check_n8n_flow.py
      - name: Authenticated connector rate limiting over HTTP
        run: python scripts/check_rate_limit.py
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.n8n.yaml logs
      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.n8n.yaml down
