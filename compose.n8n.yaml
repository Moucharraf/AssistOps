# Local demonstration only: these public credentials must never be deployed.
services:
  api:
    environment:
      ASSISTOPS_WEBHOOK_CONNECTORS: '{"demo":{"secret":"assistops-local-webhook-secret-32-chars","tenant_id":"demo","allowed_user_ids":["user-001","user-002","reviewer-001"],"source":"webhook"},"n8n-demo":{"secret":"assistops-n8n-local-signing-secret-32-chars","tenant_id":"demo","allowed_user_ids":["user-001"],"source":"webhook"}}'
  n8n-init:
    image: assistops-n8n:local
    pull_policy: never
    entrypoint: ["/bin/sh", "/opt/assistops/bootstrap.sh"]
    environment: &n8n-environment
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_PAYLOAD_SIZE_MAX: "1"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
  n8n:
    image: assistops-n8n:local
    build: integrations/n8n
    environment: *n8n-environment
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  n8n_data:
    name: assistops_n8n_v2_data
